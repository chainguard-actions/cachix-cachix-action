name: Test basic pull-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        run: |
          # Install Nix in single-user mode for act environment
          sh <(curl -L https://nixos.org/nix/install) --no-daemon || true
          # Source nix profile if available
          if [ -f "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then
            . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          fi
          echo "$HOME/.nix-profile/bin" >> $GITHUB_PATH
          echo "/nix/var/nix/profiles/default/bin" >> $GITHUB_PATH

      - id: cachix
        uses: .
        continue-on-error: true
        with:
          name: nixpkgs-python
          skipPush: "true"
          skipAddingSubstituter: "false"

      - name: Assert action ran (pull-only mode)
        env:
          OUTCOME: ${{ steps.cachix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in pull-only mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Nix may not be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
