name: Test custom cachix binary path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake cachix binary for testing
        run: |
          mkdir -p /tmp/fake-cachix-bin
          cat > /tmp/fake-cachix-bin/cachix << 'EOF'
          #!/bin/sh
          # Fake cachix binary that reports version and exits cleanly
          case "$1" in
            --version)
              echo "cachix 1.7.5"
              exit 0
              ;;
            use)
              echo "Configuring cachix cache: $2"
              exit 0
              ;;
            daemon)
              echo "Starting cachix daemon"
              exit 0
              ;;
            push)
              echo "Pushing to cachix cache"
              exit 0
              ;;
            *)
              echo "cachix: unknown command $1"
              exit 0
              ;;
          esac
          EOF
          chmod +x /tmp/fake-cachix-bin/cachix

      - id: cachix
        uses: .
        continue-on-error: true
        with:
          name: nixpkgs-python
          skipPush: "true"
          skipAddingSubstituter: "true"
          cachixBin: "/tmp/fake-cachix-bin/cachix"

      - name: Assert action ran with custom cachix binary
        env:
          OUTCOME: ${{ steps.cachix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should use the provided cachixBin path.
          # Either success or graceful failure is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom cachix binary"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
