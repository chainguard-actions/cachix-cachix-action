name: Test installCommand input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake cachix binary
        run: |
          mkdir -p /tmp/fake-cachix-bin
          cat > /tmp/fake-cachix-bin/cachix << 'EOF'
          #!/bin/sh
          echo "fake cachix called with: $*"
          exit 0
          EOF
          chmod +x /tmp/fake-cachix-bin/cachix
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-cache
          installCommand: "echo 'custom install command executed'"
          skipPush: "true"
      - name: Assert action ran with installCommand input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with installCommand input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with custom install command)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
