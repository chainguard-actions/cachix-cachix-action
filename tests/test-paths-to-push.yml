name: Test pathsToPush input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-cache
          pathsToPush: "/nix/store/fake-path-for-testing"
          skipPush: "false"
      - name: Assert action ran with pathsToPush input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pathsToPush input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid Nix store/cache)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
