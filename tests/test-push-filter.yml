name: Test push filter configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cachix
        uses: .
        continue-on-error: true
        with:
          name: nixpkgs-python
          skipPush: "false"
          skipAddingSubstituter: "true"
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"
          useDaemon: "false"

      - name: Assert action ran with pushFilter
        env:
          OUTCOME: ${{ steps.cachix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept pushFilter input without crashing at startup.
          # Either success or graceful failure (due to missing Nix/auth) is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pushFilter configured"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Nix/auth not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
