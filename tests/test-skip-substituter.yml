name: Test skip adding substituter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cachix
        uses: .
        continue-on-error: true
        with:
          name: nixpkgs-python
          skipPush: "true"
          skipAddingSubstituter: "true"

      - name: Assert action ran with skipAddingSubstituter
        env:
          OUTCOME: ${{ steps.cachix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With skipAddingSubstituter=true, the action should not attempt to modify
          # Nix config, making it more likely to succeed even without Nix installed.
          # Either success or graceful failure is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skipAddingSubstituter=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Nix environment not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
