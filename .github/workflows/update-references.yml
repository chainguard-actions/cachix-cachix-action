name: Update version references

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  update-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master

      - name: Update version references
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          safe_ref=$(printf '%s' "${REF_NAME}" | tr -d '\n\r' | sed 's/[\\&|]/\\&/g')
          sed -i "s|cachix-action@v[0-9]\+|cachix-action@${safe_ref}|g" README.md

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Update references to ${{ github.ref_name }}"
